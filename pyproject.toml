[project]
name = "gridworks-marketmaker"
version = "0.1.0"
description = "GridWorks MarketMaker — publishes the cleared price for the markets it runs."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "GridWorks", email = "gridworks@gridworks-consulting.com" },
]
requires-python = ">=3.12,<3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "gridworks-base>=0.7.1",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.3.4",
    "python-dotenv>=1.0.0",
    "requests>=2.32.3",
]

[project.scripts]
gwmm = "gwmm.cli:main"

[project.urls]
Homepage = "https://github.com/thegridelectric/gridworks-marketmaker"
Repository = "https://github.com/thegridelectric/gridworks-marketmaker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwmm"]

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.5.6",
    "types-requests>=2.32",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 88
extend-exclude = ["src/gwmm/sema"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/gwmm/sema"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
markers = [
    "integration: boots the real actor on a rabbit broker",
]
