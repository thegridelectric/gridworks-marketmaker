name: Image

# Build the MarketMaker image for amd64 and arm64. Every push and pull
# request builds it; a push to main also pushes it to GHCR as
# ghcr.io/thegridelectric/marketmaker:<short-sha> and :latest, so a box or a
# pod pulls the image of an exact commit instead of building from source.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Compute image tags
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/thegridelectric/marketmaker:latest
            ghcr.io/thegridelectric/marketmaker:${{ steps.tag.outputs.sha }}
